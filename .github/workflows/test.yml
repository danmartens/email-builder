name: Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 25]

    runs-on: ${{ matrix.os }}

    name: Node ${{ matrix.node }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install Node Dependencies
        run: yarn install --immutable

      - name: Run Jest
        run: yarn test
